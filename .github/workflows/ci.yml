name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.7.0'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.9'
      # Cache downloaded packages; always restore dependencies from the lockfile.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-1.3.9-${{ hashFiles('frontend/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-1.3.9-
      - run: make install
      - run: make verify

  security:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.mod
            go.sum
      # Exact tool-version cache: never reuse binaries from a different tool version.
      - name: Restore Gitleaks
        id: gitleaks
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/go/bin/gitleaks
          key: gitleaks-${{ runner.os }}-${{ runner.arch }}-8.30.0
      - name: Install Gitleaks
        if: steps.gitleaks.outputs.cache-hit != 'true'
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.0
      - name: Scan secrets (PR commits or full history)
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            gitleaks git --redact --no-banner --ignore-gitleaks-allow --log-opts="$BASE_SHA..$HEAD_SHA" .
          else
            gitleaks git --redact --no-banner --ignore-gitleaks-allow .
          fi
